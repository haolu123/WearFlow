[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wearflow-research"
version = "0.1.0"
description = "Integral-supervised physical-state Neural ODE tool wear monitoring and forecasting"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2", "scipy>=1.10", "scikit-learn>=1.3", "torch>=2", "PyYAML>=6", "matplotlib>=3.7", "h5py>=3.8", "threadpoolctl>=3"]

[tool.setuptools]
py-modules = ["wearflow_paths"]

[tool.setuptools.packages.find]
include = ["wear_monitoring_dynamics*", "wearflow*"]
exclude = ["*.outputs*"]

[tool.setuptools.package-data]
wear_monitoring_dynamics = ["configs/*.yaml"]
